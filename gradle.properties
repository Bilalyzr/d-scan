# Project-wide Gradle settings.
# IDE users: settings configured through the IDE override anything specified here.

# JVM arguments for the Gradle daemon. 3g comfortably covers AGP + KSP (Room, Hilt) + Compose on this single-module app.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache skips re-running build scripts when nothing in them changed.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
